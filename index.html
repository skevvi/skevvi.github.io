<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>@skevvi</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Overlay startowy -->
  <div id="overlay">
    <span id="overlay-text">?</span>
  </div>

  <div class="background-banner"></div>

  <div class="profile-card" id="profile-card">
    <div class="top-row">
      <img src="assets/avatar/avatar.png" class="avatar" alt="avatar" id="main-avatar">
      <div class="user-info">
        <div class="name-with-badge">
          <h1>skevvi</h1>
          <img src="assets/icons/badges/song.png" class="song-icon" title="">
          <img src="assets/icons/badges/crown.png" class="crown-icon" title="">
        </div>
        <p class="subtitle"><span id="typing-text"></span></p>
      </div>
    </div>

    <div class="lanyard-card">
      <div class="lanyard-left">
        <img id="lanyard-avatar" class="lanyard-avatar" src="" alt="lanyard avatar">
      </div>
      <div class="lanyard-info">
        <p id="lanyard-global-name">skevvi</p>
        <p id="lanyard-username" class="copyable" data-username="">
          <span id="username-text">@username</span>
          <span class="tooltip" id="copy-tooltip">click to copy</span>
        </p>
        <p id="lanyard-status">Status: ...</p>
        <p id="lanyard-activity">Activity: ...</p>
        <p id="spotify-status">Spotify: ...</p>
      </div>
    </div>

    <div class="music-player-card">
      <div class="music-info">
        <img id="music-cover" src="assets/music/covers/cover1.jpg" alt="cover" />
        <div class="track-details">
          <p id="track-title">Song Title</p>
          <p id="track-artist">Artist</p>
        </div>
      </div>
      <div class="player-controls-row">
        <div class="volume-control">
          <img src="assets/icons/music-player/volume.png" id="mute-btn" class="control-icon" alt="mute" />
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="main-controls">
          <img src="assets/icons/music-player/prev.png" id="prev-btn" class="control-icon" alt="prev" />
          <img src="assets/icons/music-player/play.png" id="play-btn" class="control-icon" alt="play" />
          <img src="assets/icons/music-player/next.png" id="next-btn" class="control-icon" alt="next" />
        </div>
      </div>

      <div class="progress-container">
        <div class="time-display">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
      </div>
    </div>

    <div class="social-footer">
      <div class="social-icons">
        <a href="https://discord.com/users/1402940517209079849" target="_blank">
          <img src="assets/icons/discord.png" class="icon" alt="Discord" />
        </a>
        <a href="https://youtube.com/@skevvi" target="_blank">
          <img src="assets/icons/youtube.png" class="icon" alt="YouTube" />
        </a>
        <a href="https://soundcloud.com/skevvi" target="_blank">
          <img src="assets/icons/soundcloud.png" class="icon" alt="SoundCloud" />
        </a>
      </div>
      <div class="crypto-icons">
        <div class="icon crypto" data-crypto="bc1qvdzssfzgz40rrz4e57llsc948j4emh93puu0ew">
          <img src="assets/icons/bitcoin.png" alt="Bitcoin Icon" />
          <span class="tooltip">click to copy</span>
        </div>
        <div class="icon crypto" data-crypto="0xA148fdeAc321C6D9e9Adb8d22a251EF7F81223e6">
          <img src="assets/icons/litecoin.png" alt="Litecoin Icon" />
          <span class="tooltip">click to copy</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
